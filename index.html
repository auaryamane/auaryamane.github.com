```html
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fun Math Practice for Kids</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  input::-webkit-inner-spin-button, 
  input::-webkit-outer-spin-button { 
    -webkit-appearance: none; 
    margin: 0; 
  }
  input[type=number] {
    -moz-appearance:textfield;
  }
</style>
</head>
<body class="bg-gradient-to-b from-purple-300 via-pink-300 to-yellow-200 min-h-screen flex flex-col items-center p-4 font-sans text-gray-800">

  <header class="mb-8 text-center max-w-md">
    <h1 class="text-4xl font-extrabold mb-2">Math Fun! ➕➖</h1>
    <p class="text-lg text-purple-900">Practice addition and subtraction with friendly numbers!</p>
  </header>

  <main class="bg-white bg-opacity-90 rounded-xl shadow-lg p-6 max-w-md w-full">
    <section id="problem-section" class="mb-6 text-center">
      <div class="text-5xl font-bold text-purple-700 mb-3 select-none" aria-live="polite" aria-atomic="true" id="problem">
        4 + 3 =
      </div>
      <input aria-label="Your answer" type="number" inputmode="numeric" id="answer" class="w-full rounded-md border-2 border-purple-300 focus:border-purple-600 focus:ring-2 focus:ring-purple-400 text-center text-3xl font-mono p-2" />
    </section>

    <div class="flex justify-between items-center space-x-3">
      <button id="check-btn" aria-label="Check answer" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-md shadow-md transition focus:outline-none focus:ring-4 focus:ring-purple-300">
        Check
      </button>
      <button id="next-btn" aria-label="Next problem" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-md shadow-md transition focus:outline-none focus:ring-4 focus:ring-pink-300">
        Next
      </button>
    </div>

    <section aria-live="polite" aria-atomic="true" id="feedback" class="mt-6 min-h-[3rem] text-center text-lg font-semibold"></section>
  </main>

  <footer class="mt-auto text-center text-sm text-purple-800 opacity-75 pt-6 pb-3 select-none">
    &copy; 2024 Math Fun for Kids
  </footer>

<script>
  (() => {
    const problemEl = document.getElementById('problem');
    const answerInput = document.getElementById('answer');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const feedbackEl = document.getElementById('feedback');

    let currentProblem = {};

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateProblem() {
      // Choose addition or subtraction randomly
      const type = Math.random() < 0.5 ? 'add' : 'sub';

      let a, b;
      if(type === 'add') {
        a = randomInt(1, 20);
        b = randomInt(1, 20);
      } else {
        // For subtraction, ensure no negative results for young kids
        a = randomInt(5, 20);
        b = randomInt(1, a);
      }

      currentProblem = { a, b, type };
      const symbol = type === 'add' ? '+' : '−';
      problemEl.textContent = `${a} ${symbol} ${b} =`;
      feedbackEl.textContent = '';
      answerInput.value = '';
      answerInput.disabled = false;
      answerInput.focus();
    }

    function checkAnswer() {
      const val = answerInput.value.trim();
      if (val === '') {
        feedbackEl.textContent = 'Please enter your answer!';
        feedbackEl.className = 'mt-6 text-center text-lg font-semibold text-red-600';
        answerInput.focus();
        return;
      }

      const num = Number(val);
      let correct;

      if(currentProblem.type === 'add') {
        correct = currentProblem.a + currentProblem.b;
      } else {
        correct = currentProblem.a - currentProblem.b;
      }

      if(num === correct) {
        feedbackEl.textContent = '🎉 Great job! That’s correct!';
        feedbackEl.className = 'mt-6 text-center text-lg font-semibold text-green-600';
      } else {
        feedbackEl.textContent = `❌ Oops! The right answer is ${correct}. Try another one!`;
        feedbackEl.className = 'mt-6 text-center text-lg font-semibold text-red-600';
      }
      answerInput.disabled = true;
    }

    checkBtn.addEventListener('click', checkAnswer);
    nextBtn.addEventListener('click', generateProblem);

    answerInput.addEventListener('keypress', e => {
      if(e.key === 'Enter') {
        e.preventDefault();
        checkAnswer();
      }
    });

    // Initialize first problem
    generateProblem();
  })();
</script>

</body>
</html>
