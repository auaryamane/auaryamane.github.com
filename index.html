<!DOCTYPE html>
<html lang="en" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 min-h-screen">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add & Subtract Fun Game</title>
  <script type="application/javascript" defer>
    (() => {
      // Wait for DOM loaded
      document.addEventListener('DOMContentLoaded', () => {
        const questionEl = document.getElementById('question');
        const inputEl = document.getElementById('answer');
        const submitBtn = document.getElementById('submit');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');
        const newGameBtn = document.getElementById('newGame');

        let score = 0;
        let total = 0;
        let currentAnswer = 0;

        function getRandomInt(min, max) {
          return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuestion() {
          let num1 = getRandomInt(1, 20);
          let num2 = getRandomInt(1, 20);
          let isAddition = Math.random() < 0.5;

          // To avoid negative results in subtraction for 7 year olds
          if (!isAddition && num2 > num1) [num1, num2] = [num2, num1];

          if (isAddition) {
            currentAnswer = num1 + num2;
            questionEl.textContent = `${num1} + ${num2} = ?`;
          } else {
            currentAnswer = num1 - num2;
            questionEl.textContent = `${num1} - ${num2} = ?`;
          }
          inputEl.value = '';
          feedbackEl.textContent = '';
          inputEl.focus();
        }

        function updateScore() {
          scoreEl.textContent = `Score: ${score} / ${total}`;
        }

        function checkAnswer() {
          let userAnswer = parseInt(inputEl.value.trim(), 10);
          if (Number.isNaN(userAnswer)) {
            feedbackEl.textContent = 'Please enter a valid number!';
            feedbackEl.classList.remove('text-green-500');
            feedbackEl.classList.add('text-red-500');
            return;
          }
          total++;
          if (userAnswer === currentAnswer) {
            score++;
            feedbackEl.textContent = 'Correct! 🎉';
            feedbackEl.classList.remove('text-red-500');
            feedbackEl.classList.add('text-green-500');
          } else {
            feedbackEl.textContent = `Oops! The right answer was ${currentAnswer}.`;
            feedbackEl.classList.remove('text-green-500');
            feedbackEl.classList.add('text-red-500');
          }
          updateScore();
          setTimeout(generateQuestion, 1500);
        }

        function newGame() {
          score = 0;
          total = 0;
          updateScore();
          feedbackEl.textContent = '';
          generateQuestion();
        }

        submitBtn.addEventListener('click', checkAnswer);
        inputEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            checkAnswer();
          }
        });
        newGameBtn.addEventListener('click', newGame);

        newGame();
      });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <main class="w-full max-w-md bg-white bg-opacity-90 rounded-3xl shadow-lg p-8 flex flex-col space-y-6">
    <h1 class="text-4xl font-extrabold text-center text-indigo-700 select-none">Add & Subtract Fun!</h1>
    <section class="bg-indigo-100 rounded-xl p-6 flex flex-col items-center space-y-4">
      <div id="question" class="text-3xl font-semibold text-indigo-900 select-none"></div>
      <input
        id="answer"
        type="number"
        inputmode="numeric"
        autocomplete="off"
        aria-label="Answer input"
        class="w-40 p-3 rounded-lg border-2 border-indigo-300 text-center text-xl font-semibold focus:outline-none focus:ring-4 focus:ring-indigo-400 focus:border-indigo-500 transition"
        placeholder="Your answer"
      />
      <button
        id="submit"
        class="w-40 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 rounded-lg shadow-md transition"
        aria-label="Submit your answer"
      >
        Check Answer
      </button>
      <p id="feedback" aria-live="polite" class="h-8 font-semibold text-lg"></p>
    </section>
    <section class="flex justify-between items-center text-indigo-700 font-semibold">
      <div id="score" class="text-xl select-none">Score: 0 / 0</div>
      <button
        id="newGame"
        class="bg-pink-500 hover:bg-pink-600 active:bg-pink-700 text-white font-bold py-2 px-5 rounded-lg shadow-md transition"
        aria-label="Start a new game"
      >
        New Game
      </button>
    </section>
    <footer class="text-center text-indigo-600 text-sm select-none">
      Keep practicing & have fun! 🎈
    </footer>
  </main>
</body>
</html>
