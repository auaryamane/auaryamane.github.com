```html
<!DOCTYPE html>
<html lang="en" class="bg-gradient-to-b from-indigo-200 via-purple-200 to-pink-200 min-h-screen">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add & Subtract Game for Kids</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 font-sans text-gray-800">
  <main class="bg-white bg-opacity-80 rounded-xl shadow-xl p-6 max-w-md w-full">
    <h1 class="text-center text-3xl font-extrabold mb-6 text-purple-700 select-none">
      Addition & Subtraction Game
    </h1>
    <p class="text-center mb-6 text-gray-600 select-none">
      Solve the problem below! Try to get as many right in a row as you can!
    </p>

    <div id="game" class="space-y-4">
      <div class="text-center text-4xl font-bold text-indigo-700 select-none" id="problem">
        0 + 0 =
      </div>
      <form id="answerForm" class="flex justify-center items-center space-x-3">
        <input
          id="answerInput"
          type="number"
          inputmode="numeric"
          autofocus
          aria-label="Answer input"
          class="w-24 text-center text-2xl font-semibold rounded-md border-2 border-indigo-300 focus:outline-none focus:ring-4 focus:ring-indigo-400 focus:border-indigo-500 transition"
          required
        />
        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-semibold px-5 py-2 rounded-md transition select-none"
        >
          Submit
        </button>
      </form>

      <p id="feedback" class="text-center h-6 text-lg font-semibold select-none"></p>

      <div class="flex justify-between items-center mt-4 select-none font-medium text-indigo-700">
        <div>Score: <span id="score">0</span></div>
        <div>Streak: <span id="streak">0</span></div>
        <button
          id="resetBtn"
          class="bg-pink-500 hover:bg-pink-600 text-white px-3 py-1 rounded-md text-sm font-semibold transition select-none"
          type="button"
          aria-label="Reset the game"
        >
          Reset
        </button>
      </div>
    </div>

  </main>

<script>
(() => {
  const problemEl = document.getElementById('problem');
  const answerForm = document.getElementById('answerForm');
  const answerInput = document.getElementById('answerInput');
  const feedbackEl = document.getElementById('feedback');
  const scoreEl = document.getElementById('score');
  const streakEl = document.getElementById('streak');
  const resetBtn = document.getElementById('resetBtn');

  let score = 0;
  let streak = 0;
  let currentAnswer = 0;

  // Utility: get random integer [min, max]
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // Generate an addition or subtraction problem suitable for 7 years old
  function generateProblem() {
    /*
      Rules:
      - operands 0 to 20
      - subtraction does not produce negative results
      - addition max 20+20=40 (okay for age 7)
    */
    const addOrSubtract = Math.random() < 0.5 ? '+' : '-';
    let a, b;

    if (addOrSubtract === '+') {
      a = randInt(0, 20);
      b = randInt(0, 20);
      currentAnswer = a + b;
    } else {
      a = randInt(0, 20);
      b = randInt(0, a); // b <= a to avoid negative result
      currentAnswer = a - b;
    }
    problemEl.textContent = `${a} ${addOrSubtract} ${b} =`;
  }

  // Update score and streak displays
  function updateScore() {
    scoreEl.textContent = score;
    streakEl.textContent = streak;
  }

  // Show feedback message and style
  function showFeedback(correct) {
    if (correct) {
      feedbackEl.textContent = '🎉 Correct!';
      feedbackEl.classList.remove('text-red-600');
      feedbackEl.classList.add('text-green-600');
    } else {
      feedbackEl.textContent = `❌ Whoops! The right answer was ${currentAnswer}.`;
      feedbackEl.classList.remove('text-green-600');
      feedbackEl.classList.add('text-red-600');
    }
  }

  // Reset game state
  function resetGame() {
    score = 0;
    streak = 0;
    updateScore();
    feedbackEl.textContent = '';
    generateProblem();
    answerInput.value = '';
    answerInput.focus();
  }

  // Initialization
  generateProblem();

  answerForm.addEventListener('submit', e => {
    e.preventDefault();
    const val = answerInput.value.trim();
    if (val === '') return;
    const num = Number(val);
    if (Number.isNaN(num)) return;

    if (num === currentAnswer) {
      score += 1;
      streak += 1;
      showFeedback(true);
    } else {
      streak = 0;
      showFeedback(false);
    }

    updateScore();
    answerInput.value = '';
    answerInput.focus();
    generateProblem();
  });

  resetBtn.addEventListener('click', resetGame);
})();
</script>
</body>
</html>
