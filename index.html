<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Popup Iframe Example</title>
    <style>
        #styledInput {
            width: 300px;
            height: 40px;
            line-height: 40px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0 10px;
            font-size: 16px;
            color: #333;
        }

        #submit-btn {
            width: 160px;
            height: 40px;
            line-height: 40px;
            background: tomato;
            border-radius: 4px;
            align-items: center;
            text-align: center;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="jsonOutput"></div>
    <input id="styledInput" placeholder="Enter the url here" />
    <div id="submit-btn">Open Popup</div>
    <script src="https://ir.ebaystatic.com/cr/v/c01/eps/eps-popup-sdk.v0.0.9.js"></script>

    <script>
        function openPopupWindow(url, popupWidth, popupHeight) {
            const { top, left, width, height } = getWindowLayout();
            let _popupWidth = popupWidth;
            let _popupHeight = popupHeight;
            if (!_popupWidth || !_popupHeight) {
                _popupWidth = width;
                _popupHeight = height;
            }
            const _top = (height - _popupHeight) / 2 + top;
            const _left = (width - _popupWidth) / 2 + left;
            const sizeParams = `,width=${_popupWidth},height=${_popupHeight}`;
            const positionParams = `,top=${_top},left=${_left}`;
            const commonParams = ',location=no,alwaysRaised=yes,dependent=yes,hotkeys=yes,modal=yes';
            const popup = window.open(url, '_blank', `${commonParams}${sizeParams}${positionParams}`);
            return popup;
        }

        const jsonOutputElement = document.getElementById('jsonOutput');

        console.log('script code have loaded')
        const popupSDK = new EPSPopupSDK({
            onSuccess: function (data) {
                const newParagraph = document.createElement('p');
                newParagraph.textContent = 'Success event triggered:';
                jsonOutputElement.appendChild(newParagraph)
                const newParagraph2 = document.createElement('p');
                newParagraph2.textContent = JSON.stringify(data, null, 2);
                jsonOutputElement.appendChild(newParagraph2)
            },
            onClose: function () {
                const newParagraph = document.createElement('p');
                newParagraph.textContent = 'Close event triggered';
                jsonOutputElement.appendChild(newParagraph)
            },
            onError: function (error) {
                const newParagraph = document.createElement('p');
                newParagraph.textContent = 'Error event triggered:';
                jsonOutputElement.appendChild(newParagraph)
                const newParagraph2 = document.createElement('p');
                newParagraph2.textContent = JSON.stringify(error, null, 2);
                jsonOutputElement.appendChild(newParagraph2)
            },
        });

        document.getElementById("submit-btn").onclick = function () {
            jsonOutputElement.innerHTML = ''
            const userInput = document.getElementById('styledInput').value;
            const urlRegex = /^(https?:\/\/)?([a-zA-Z0-9.-]+)(:[0-9]+)?(\/.*)?$/;
            if (!userInput) {
                popupSDK.open('https://ppcapp.vip.qa.ebay.com/eps/begin');
            }
            else if (urlRegex.test(userInput)) {
                popupSDK.open(userInput);
            } else {
                console.error('Invalid URL:', userInput);
                alert('Please enter the validate URL');
            }
            // const newTab = openPopupWindow('https://ppcapp8.stratus.qa.ebay.com/bic/tenant/begin', 800, 600);
            // if (newTab) {
            //     newTab.focus();
            //     const interval = setInterval(() => {
            //       if (newTab.closed) {
            //         clearInterval(interval);
            //       }
            //     }, 200);
            // }
        }

        // document.getElementById("ebay-alert")?.style?.display = "none";
    </script>
</body>

</html>
