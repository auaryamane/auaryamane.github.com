```html
<!DOCTYPE html>
<html lang="en" class="bg-gradient-to-b from-blue-100 via-white to-blue-100 min-h-screen">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Country & Continent Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen justify-center items-center px-4 py-8 font-sans text-gray-800">
  <header class="mb-8 text-center max-w-xl">
    <h1 class="text-4xl font-extrabold text-blue-700 mb-2">Country & Continent Test</h1>
    <p class="text-lg text-blue-600">Let's learn about countries and continents!</p>
  </header>

  <main class="w-full max-w-lg bg-white shadow-lg rounded-2xl p-6 sm:p-10">
    <form id="quizForm" class="space-y-8">
      <!-- Question 1 -->
      <section>
        <h2 class="text-2xl font-semibold mb-3">1. What continent is Egypt in?</h2>
        <fieldset class="space-y-2">
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-blue-50">
            <input type="radio" name="q1" value="Africa" class="form-radio text-blue-600" required />
            <span>Africa</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-blue-50">
            <input type="radio" name="q1" value="Asia" class="form-radio text-blue-600" />
            <span>Asia</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-blue-50">
            <input type="radio" name="q1" value="Europe" class="form-radio text-blue-600" />
            <span>Europe</span>
          </label>
        </fieldset>
      </section>

      <!-- Question 2 -->
      <section>
        <h2 class="text-2xl font-semibold mb-3">2. Which country is in South America?</h2>
        <fieldset class="space-y-2">
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-green-50">
            <input type="radio" name="q2" value="Brazil" class="form-radio text-green-600" required />
            <span>Brazil</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-green-50">
            <input type="radio" name="q2" value="Spain" class="form-radio text-green-600" />
            <span>Spain</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-green-50">
            <input type="radio" name="q2" value="Canada" class="form-radio text-green-600" />
            <span>Canada</span>
          </label>
        </fieldset>
      </section>

      <!-- Question 3 -->
      <section>
        <h2 class="text-2xl font-semibold mb-3">3. Which continent is Australia part of?</h2>
        <fieldset class="space-y-2">
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-pink-50">
            <input type="radio" name="q3" value="Australia" class="form-radio text-pink-600" required />
            <span>Australia</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-pink-50">
            <input type="radio" name="q3" value="Antarctica" class="form-radio text-pink-600" />
            <span>Antarctica</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-pink-50">
            <input type="radio" name="q3" value="Asia" class="form-radio text-pink-600" />
            <span>Asia</span>
          </label>
        </fieldset>
      </section>

      <!-- Question 4 -->
      <section>
        <h2 class="text-2xl font-semibold mb-3">4. Which country is in Europe?</h2>
        <fieldset class="space-y-2">
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-purple-50">
            <input type="radio" name="q4" value="France" class="form-radio text-purple-600" required />
            <span>France</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-purple-50">
            <input type="radio" name="q4" value="Kenya" class="form-radio text-purple-600" />
            <span>Kenya</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-purple-50">
            <input type="radio" name="q4" value="Japan" class="form-radio text-purple-600" />
            <span>Japan</span>
          </label>
        </fieldset>
      </section>

      <!-- Question 5 -->
      <section>
        <h2 class="text-2xl font-semibold mb-3">5. What continent is India in?</h2>
        <fieldset class="space-y-2">
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-yellow-50">
            <input type="radio" name="q5" value="Asia" class="form-radio text-yellow-600" required />
            <span>Asia</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-yellow-50">
            <input type="radio" name="q5" value="Europe" class="form-radio text-yellow-600" />
            <span>Europe</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer rounded-lg p-3 hover:bg-yellow-50">
            <input type="radio" name="q5" value="Africa" class="form-radio text-yellow-600" />
            <span>Africa</span>
          </label>
        </fieldset>
      </section>

      <div class="flex justify-center">
        <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-full font-semibold hover:bg-blue-700 transition focus:outline-none focus:ring-4 focus:ring-blue-300">
          Check Answers
        </button>
      </div>
    </form>

    <div id="result" class="mt-8 text-center text-xl font-bold text-blue-700 hidden"></div>
  </main>

  <script>
    const quizForm = document.getElementById('quizForm');
    const resultDiv = document.getElementById('result');

    // Correct answers keyed by question name
    const answers = {
      q1: 'Africa',
      q2: 'Brazil',
      q3: 'Australia',
      q4: 'France',
      q5: 'Asia'
    };

    quizForm.addEventListener('submit', e => {
      e.preventDefault();
      let score = 0;
      const total = Object.keys(answers).length;

      for (const [key, correctAnswer] of Object.entries(answers)) {
        const userAnswer = quizForm.elements[key].value;
        if (userAnswer === correctAnswer) score++;
      }

      const percent = Math.round((score / total) * 100);

      let message = '';

      if (percent === 100) {
        message = "Awesome! You got all questions right! 🎉";
      } else if (percent >= 80) {
        message = `Great job! You scored ${score} out of ${total}. 🙂`;
      } else if (percent >= 50) {
        message = `Good try! You scored ${score} out of ${total}. Keep learning! 🌟`;
      } else {
        message = `You scored ${score} out of ${total}. Don't give up, try again! 💪`;
      }

      resultDiv.textContent = message;
      resultDiv.classList.remove('hidden');
      resultDiv.scrollIntoView({behavior: 'smooth'});
    });
  </script>
</body>
</html>
